<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Physics Playground | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* ========================================
           ROOT
        ======================================== */

        :root {
            --bg: #08080d;
            --panel: #101019;

            --purple: #9b6cff;
            --purple-light: #c5a8ff;

            --cyan: #3df3ff;

            --text: #f5f5f8;
            --muted: #85899b;

            --border: rgba(255, 255, 255, 0.09);
        }


        /* ========================================
           RESET
        ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: "Plus Jakarta Sans", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 50% 0%, rgba(155, 108, 255, 0.14), transparent 38%),
                radial-gradient(circle at 100% 100%, rgba(61, 243, 255, 0.07), transparent 30%),
                var(--bg);
            overflow-x: hidden;
            overflow-y: auto;
        }


        /* ========================================
           BACKGROUND GRID
        ======================================== */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 55px 55px;
            mask-image: radial-gradient(circle at center, black 20%, transparent 80%);
            z-index: 0;
        }


        /* ========================================
           AMBIENT LIGHTS
        ======================================== */

        .ambient {
            position: fixed;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            filter: blur(110px);
            pointer-events: none;
            opacity: 0.13;
            z-index: 0;
        }

        .ambient-one {
            top: -140px;
            left: -120px;
            background: var(--purple);
        }

        .ambient-two {
            right: -140px;
            bottom: -120px;
            background: var(--cyan);
        }


        /* ========================================
           PAGE
        ======================================== */

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 55px 25px;
            position: relative;
            z-index: 1;
        }


        /* ========================================
           LOGIN CARD
        ======================================== */

        .login-card {
            width: 100%;
            max-width: 760px;
            padding: 52px 70px 42px;
            background: linear-gradient(145deg, rgba(20, 20, 31, 0.97), rgba(8, 8, 14, 0.99));
            border: 1px solid rgba(255, 255, 255, 0.11);
            border-radius: 28px;
            box-shadow:
                0 35px 110px rgba(0, 0, 0, 0.72),
                0 0 70px rgba(155, 108, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(25px);
            position: relative;
            overflow: hidden;
            animation: cardAppear 0.7s ease forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* TOP GLOW */
        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--purple), var(--cyan), var(--purple), transparent);
            box-shadow: 0 0 20px rgba(155, 108, 255, 0.8);
        }

        /* CARD AMBIENT GLOW */
        .login-card::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            right: -170px;
            top: 80px;
            border-radius: 50%;
            background: rgba(155, 108, 255, 0.08);
            filter: blur(70px);
            pointer-events: none;
        }


        /* ========================================
           BRAND
        ======================================== */

        .brand {
            display: inline-block;
            color: white;
            text-decoration: none;
            font-family: "JetBrains Mono", monospace;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 1.4px;
            text-shadow: 0 0 18px rgba(255, 255, 255, 0.12);
        }

        .brand span {
            color: var(--purple);
            text-shadow: 0 0 18px rgba(155, 108, 255, 0.5);
        }


        /* ========================================
           LAB LABEL
        ======================================== */

        .lab-label {
            margin-top: 40px;
            font-family: "JetBrains Mono", monospace;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: var(--cyan);
            text-shadow: 0 0 14px rgba(61, 243, 255, 0.35);
        }


        /* ========================================
           HEADING
        ======================================== */

        h1 {
            margin-top: 12px;
            font-size: 60px;
            line-height: 1.08;
            letter-spacing: -2.5px;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }


        /* ========================================
           DESCRIPTION
        ======================================== */

        .description {
            margin-top: 16px;
            color: var(--muted);
            font-size: 19px;
            line-height: 1.7;
            max-width: 570px;
        }


        /* ========================================
           FORM
        ======================================== */

        .login-form {
            margin-top: 34px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-family: "JetBrains Mono", monospace;
            font-size: 15px;
            font-weight: 700;
            color: #d2d3df;
            letter-spacing: 0.7px;
        }

        input {
            width: 100%;
            height: 60px;
            padding: 0 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.035);
            color: white;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 18px;
            transition: 0.3s ease;
        }

        input::placeholder {
            color: #5f6272;
        }

        input:hover {
            border-color: rgba(255, 255, 255, 0.18);
        }

        input:focus {
            border-color: rgba(155, 108, 255, 0.8);
            background: rgba(155, 108, 255, 0.045);
            box-shadow:
                0 0 0 4px rgba(155, 108, 255, 0.07),
                0 0 25px rgba(155, 108, 255, 0.15);
        }


        /* ========================================
           LOGIN BUTTON
        ======================================== */

        .login-button {
            width: 100%;
            height: 62px;
            margin-top: 4px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: white;
            color: #08080d;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            transition: 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.08);
        }

        .login-button:hover {
            transform: translateY(-3px);
            background: #eee9ff;
            box-shadow:
                0 0 18px rgba(255, 255, 255, 0.3),
                0 0 40px rgba(155, 108, 255, 0.48),
                0 12px 40px rgba(155, 108, 255, 0.2);
        }

        .login-button:active {
            transform: translateY(0);
        }


        /* ========================================
           LOGOUT BUTTON
        ======================================== */

        .logout-button {
            width: 100%;
            height: 58px;
            margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 12px;
            cursor: pointer;
            background: white;
            color: #08080d;
            font-family: "Plus Jakarta Sans", sans-serif;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.8px;
            transition: 0.3s ease;
            box-shadow:
                0 0 15px rgba(255, 255, 255, 0.08),
                0 0 25px rgba(155, 108, 255, 0.12);
        }

        .logout-button:hover {
            transform: translateY(-3px);
            background: #eee9ff;
            border-color: white;
            box-shadow:
                0 0 18px rgba(255, 255, 255, 0.3),
                0 0 40px rgba(155, 108, 255, 0.48),
                0 12px 35px rgba(155, 108, 255, 0.22);
        }

        .logout-button:active {
            transform: translateY(0);
        }


        /* ========================================
           MESSAGE
        ======================================== */

        #loginMessage {
            min-height: 22px;
            margin-top: 14px;
            text-align: center;
            color: #ff8e9e;
            font-size: 16px;
        }


        /* ========================================
           FOOTER
        ======================================== */

        .login-footer {
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .login-footer p {
            color: var(--muted);
            font-size: 16px;
        }

        .login-footer a {
            color: var(--purple-light);
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .login-footer a:hover {
            color: white;
            text-shadow: 0 0 12px rgba(155, 108, 255, 0.7);
        }

        .back-home {
            display: inline-block;
            margin-top: 17px;
            color: #777b8d !important;
            text-decoration: none;
            font-family: "JetBrains Mono", monospace;
            font-size: 14px !important;
            font-weight: 600 !important;
            transition: 0.2s ease;
        }

        .back-home:hover {
            color: white !important;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
        }


        /* ========================================
           RESPONSIVE
        ======================================== */

        @media (max-width: 700px) {

            .login-page {
                padding: 35px 18px;
            }

            .login-card {
                max-width: 100%;
                padding: 40px 28px 32px;
                border-radius: 22px;
            }

            h1 {
                font-size: 46px;
                letter-spacing: -1.5px;
            }

            .description {
                font-size: 17px;
            }

            .lab-label {
                font-size: 13px;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 420px) {

            .login-card {
                padding: 35px 22px 30px;
            }

            h1 {
                font-size: 40px;
            }

            .brand {
                font-size: 19px;
            }
        }

    </style>

</head>


<body>

    <!-- Ambient Background -->
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>


    <!-- Login Page -->
    <main class="login-page">

        <section class="login-card">

            <!-- Brand -->
            <a href="index.html" class="brand">
                PHYSICS <span>PLAYGROUND</span>
            </a>

            <!-- Lab Label -->
            <p class="lab-label">
                COMPUTATIONAL PHYSICS LABORATORY
            </p>

            <!-- Heading -->
            <h1>
                Enter the<br>
                Laboratory
            </h1>

            <!-- Description -->
            <p class="description">
                Log in to access interactive physics
                experiments, simulations and your
                personal laboratory workspace.
            </p>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">

                <!-- Email -->
                <div class="input-group">
                    <label for="email">EMAIL ADDRESS</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- Login -->
                <button type="submit" class="login-button">
                    ENTER LABORATORY →
                </button>

                <!-- Logout -->
                <button type="button" class="logout-button" id="logoutButton">
                    LOGOUT
                </button>

            </form>

            <!-- Login Message -->
            <p id="loginMessage" aria-live="polite"></p>

            <!-- Footer -->
            <div class="login-footer">

                <p>
                    Don't have an account?
                    <a href="signup.html">Create one</a>
                </p>

                <a href="index.html" class="back-home">
                    ← BACK TO PHYSICS PLAYGROUND
                </a>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="js/login.js"></script>
    <script src="js/logout.js"></script>

</body>

</html>
